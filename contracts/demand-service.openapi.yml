openapi: 3.0.3
info:
  title: demand-service
  version: 1.0.0
  description: >
    Necesidades de personal, estado de Reclutamiento y candidatos propuestos por mejor coincidencia de rol.
    El servicio propone; no asigna.
servers:
  - url: http://localhost:8085
tags:
  - name: demand
paths:
  /needs:
    get:
      tags: [demand]
      operationId: listNeeds
      summary: Tablero de demanda
      responses:
        "200":
          description: Necesidades abiertas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Need"
    put:
      tags: [demand]
      operationId: replaceNeeds
      summary: Recibe de la ingesta las necesidades y el seguimiento de Reclutamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NeedBatch"
      responses:
        "200":
          description: Cantidad de necesidades guardadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedBatchResult"
    post:
      tags: [demand]
      operationId: createInformalNeed
      summary: Registra una necesidad informal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NeedInput"
      responses:
        "201":
          description: Necesidad registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Need"
  /needs/{needId}/candidates:
    get:
      tags: [demand]
      operationId: listCandidates
      summary: Candidatos propuestos para una necesidad
      parameters:
        - name: needId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Candidatos ordenados, cada uno con su razón
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candidate"
        "404":
          description: La necesidad no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    NeedBatch:
      type: object
      required: [needs]
      properties:
        needs:
          type: array
          items:
            $ref: "#/components/schemas/NeedInput"
    NeedBatchResult:
      type: object
      properties:
        stored:
          type: integer
    NeedInput:
      type: object
      required: [profile, origin]
      properties:
        needId:
          type: string
          description: Identificador en la fuente. Si falta, el servicio genera uno.
        tribe:
          type: string
        squad:
          type: string
        project:
          type: string
        profile:
          type: string
        quantity:
          type: integer
        mechanism:
          type: string
          description: PREPER_BOX, PROVIDER_ACT o UNDEFINED.
        mechanismRef:
          type: string
        mechanismValid:
          type: boolean
          description: Falso si la caja o el acta de respaldo no existe en su fuente.
        requiredDate:
          type: string
          format: date
        requester:
          type: string
        origin:
          type: string
          description: STAFFING_PORTAL, PROVIDER_ACT o INFORMAL.
        recruitmentStatus:
          type: string
          description: Estado informado por Reclutamiento. Si falta, queda PENDING_CONFIRMATION.
        recruitmentUpdatedAt:
          type: string
          format: date
    Need:
      allOf:
        - $ref: "#/components/schemas/NeedInput"
        - type: object
          properties:
            candidateCount:
              type: integer
    Candidate:
      type: object
      properties:
        personId:
          type: string
        role:
          type: string
        availableFrom:
          type: string
          format: date
        availabilityState:
          type: string
          description: FORECAST o CONFIRMED.
        reason:
          type: string
        toValidate:
          type: string
        rank:
          type: integer
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
