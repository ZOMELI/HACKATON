quarkus.application.name=ingestion-service
quarkus.http.port=8082
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/

# Contract-first: se publica el contrato estático, no uno escaneado del código.
mp.openapi.scan.disable=true
quarkus.swagger-ui.always-include=true

# PostgreSQL compartido (base `hackaton`); cada servicio trabaja en su propio esquema.
# Las tablas las crean las migraciones Flyway de database/ingestion (docker-compose).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:assistant}
quarkus.datasource.password=${DB_PASSWORD:assistant}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/hackaton}
quarkus.hibernate-orm.database.default-schema=ingestion
quarkus.datasource.devservices.enabled=false

# Servicios a los que llama.
quarkus.rest-client.mock-sources.url=${MOCK_SOURCES_URL:http://localhost:8081}
quarkus.rest-client.ledger.url=${LEDGER_URL:http://localhost:8083}
quarkus.rest-client.cases.url=${CASES_URL:http://localhost:8084}
quarkus.rest-client.demand.url=${DEMAND_URL:http://localhost:8085}
quarkus.rest-client.agents.url=${AGENTS_URL:http://localhost:8086}
quarkus.rest-client.agents.read-timeout=60000

# Carpeta con los Excel y los correos (volumen montado en docker-compose).
ingestion.sources.dir=${SOURCES_DIR:../../fuentes}
